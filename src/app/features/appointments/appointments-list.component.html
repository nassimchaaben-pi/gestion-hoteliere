<section class="appointments-list">
  <h2>Liste des rendez-vous</h2>
  <div class="actions">
    <a routerLink="/appointments/new">➕ Nouveau rendez-vous</a>
  </div>
  <div *ngIf="loading" class="loading">Chargement...</div>
  <div *ngIf="error" class="error">{{ error }}</div>

  <div *ngIf="!loading && !error">
    <div class="table-tools">
      <input placeholder="Rechercher" (input)="applyFilter($event)" />
    </div>

    <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z2">

      <ng-container matColumnDef="patient">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Patient</th>
        <td mat-cell *matCellDef="let row">{{ row.patientName || row.patient }}</td>
      </ng-container>

      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Date</th>
        <td mat-cell *matCellDef="let row">{{ row.date }}</td>
      </ng-container>

      <ng-container matColumnDef="time">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Heure</th>
        <td mat-cell *matCellDef="let row">{{ row.time }}</td>
      </ng-container>

      <ng-container matColumnDef="reason">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Motif</th>
        <td mat-cell *matCellDef="let row">{{ row.reason || '—' }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let row">
          <a [routerLink]="['/appointments', row.id]" mat-button>
            <mat-icon>visibility</mat-icon>
          </a>
          <a [routerLink]="['/appointments', row.id, 'edit']" mat-button>
            <mat-icon>edit</mat-icon>
          </a>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
  </div>

  <div *ngIf="!loading && !error && !dataSource.data.length" class="empty">Aucun rendez-vous trouvé.</div>
</section>
